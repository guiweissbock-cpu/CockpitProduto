name: Atualizar Dashboard

on:
  push:
    paths:
      - "data/**"
      - "gerar_dashboard.py"
      - "template.html"
  schedule:
    # roda duas vezes por dia: ~05h07 e ~08h07 (horário de Brasília = 08:07 e 11:07 UTC)
    # minuto fora do "cheio" (07) pra evitar a fila de congestionamento do GitHub Actions no início da hora
    - cron: "7 8 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIBLIOTECA_PAI_SHEET_ID: ${{ secrets.BIBLIOTECA_PAI_SHEET_ID }}
          CONSUMOS_ZOOM_SHEET_ID: ${{ secrets.CONSUMOS_ZOOM_SHEET_ID }}
        run: python gerar_dashboard.py

      - name: Commit index.html atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou no index.html, pulando commit."
          else
            git commit -m "Dashboard atualizado - $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
